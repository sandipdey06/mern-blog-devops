services:
  mongo:
    image: mongo:7
    container_name: blog-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blog-backend
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/blogdb
    depends_on:
      mongo: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: blog-frontend
    restart: unless-stopped
    ports: ["3000:8080"]
    depends_on: [backend]

volumes:
  mongo-data:
